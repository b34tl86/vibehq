[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibehq"
version = "0.1.0"
description = "Autonomous Multi-Agent Virtual Headquarters & Procedural Isometric Visualizer for Vibe Coding"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VibeHQ Core Team" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "httpx>=0.24.0",
]

[project.scripts]
vibehq = "vibehq.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibehq*"]

[tool.setuptools.package-data]
vibehq = [
    "templates/*.json",
    "templates/*.md",
    "generator/*.html",
]
